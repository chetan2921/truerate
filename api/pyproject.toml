[project]
name = "truerate"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymongo>=4.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "typer>=0.12",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
]

[project.scripts]
truerate = "truerate.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "mongomock>=4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["truerate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
